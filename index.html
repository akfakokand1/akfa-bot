<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AKFA Qo'qon Premium — buyurtma</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f3f3f2;--card:#fff;--ink:#1a1a1a;--mut:#666;--line:#dcdcdc;--red:#e31e24;--redd:#b9151a;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#1e1e1e;--ink:#f1f1f1;--mut:#a5a5a5;--line:#333;--red:#ff4046;--redd:#ff6b70}}
:root[data-theme="dark"]{--bg:#141414;--card:#1e1e1e;--ink:#f1f1f1;--mut:#a5a5a5;--line:#333;--red:#ff4046;--redd:#ff6b70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif;line-height:1.4}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;border-bottom:3px solid var(--red);display:flex;align-items:center;gap:12px;padding:8px 16px}
header img{height:46px;display:block}.brand{font-weight:800;line-height:1.1;color:#1a1a1a}.brand small{display:block;font-weight:500;font-size:12px;color:#666}
button{font:inherit;cursor:pointer}.cartbtn{margin-left:auto;background:var(--red);color:#fff;border:0;border-radius:6px;padding:10px 14px;font-weight:800}
main{max-width:1100px;margin:auto;padding:16px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 11px;width:100%}
:is(button,input,textarea):focus-visible{outline:3px solid var(--red);outline-offset:2px}
.meta{color:var(--mut);font-size:14px}.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}.bar h2{margin:0;font-size:20px;border-left:5px solid var(--red);padding-left:10px}
.back{background:#1a1a1a;color:#fff;border:0;border-radius:6px;padding:9px 14px;font-weight:700;white-space:nowrap}.back:hover{background:var(--red)}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}.tab{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 16px;font-weight:700;white-space:nowrap}.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid #1a1a1a;border-radius:6px;padding:14px;text-align:left;color:var(--ink);display:flex;gap:10px;align-items:center;min-height:62px}.card:hover{border-left-color:var(--red)}
.card b{font-size:15px;display:block}.card span.m{font-size:13px;color:var(--mut)}.sw{flex:0 0 30px;height:30px;border-radius:50%;border:1px solid #888}
.list{background:var(--card);border:1px solid var(--line);border-radius:6px}.it{display:grid;grid-template-columns:1fr 140px 110px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}.it:last-child{border:0}
.it small{display:block;color:var(--mut);font-size:12px}.it input{padding:8px}
.add{background:#1a1a1a;color:#fff;border:0;border-radius:6px;padding:10px;font-weight:700}.add:hover{background:var(--red)}
.li{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:6px;margin-bottom:8px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.li input[type=number]{max-width:90px}.x{background:none;border:0;color:var(--bad);font-weight:700}
.form{display:grid;gap:8px;margin-top:14px}.send{background:var(--red);color:#fff;border:0;border-radius:6px;padding:14px;font-weight:800}.send:hover{background:var(--redd)}
.sec{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:10px}.badge{display:inline-block;background:#1a1a1a;color:#fff;border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700}
.contact{background:#1a1a1a;color:#e8e8e8;border-top:6px solid var(--red);margin-top:24px;padding:26px 16px 36px}.contact>div{max-width:1100px;margin:auto;display:grid;gap:14px}
.contact h3{margin:0;font-size:20px;color:#fff;border-left:5px solid var(--red);padding-left:10px}.contact a{color:#fff}.contact .ph{font-size:22px;font-weight:800;text-decoration:none}
.lm{background:rgba(227,30,36,.16);border:1px solid var(--red);border-radius:6px;padding:10px 12px;font-size:16px}.lm b{color:#fff}
.lk{display:flex;gap:10px;flex-wrap:wrap}.lk a{display:inline-flex;align-items:center;gap:8px;border:1px solid #555;border-radius:6px;padding:10px 14px;text-decoration:none;font-weight:700}.lk a:hover{border-color:var(--red);background:var(--red)}.lk svg{width:20px;height:20px;fill:currentColor}

@media(max-width:600px){.it{grid-template-columns:1fr 1fr}.it>div:first-child{grid-column:1/3}}
.stp{display:flex;align-items:center;gap:4px}.stp input{width:58px;text-align:center;padding:8px 2px}.pm{width:36px;height:38px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font-size:20px;font-weight:700;padding:0;line-height:1}.pm:hover{border-color:var(--red);color:var(--red)}
.add:disabled{opacity:.35;cursor:not-allowed}.add:disabled:hover{background:#1a1a1a}input[type=number]{-moz-appearance:textfield}input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.li .row>input{flex:1}
html,body,button,input,textarea,a,select{touch-action:manipulation}button{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
</style></head><body>

 const msg=m=>$("#msg").textContent=m;$("#fo").oninput=e=>form.note=e.target.value;
 if(!inTg){$("#fn").oninput=e=>form.name=e.target.value;$("#fp").oninput=e=>form.phone=e.target.value;$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(text());msg("Nusxalandi.")}catch(e){msg("Nusxalab bo'lmadi.")}}}
 $("#go").onclick=async()=>{if(inTg){const b=$("#go");b.disabled=true;b.textContent="Yuborilmoqda...";try{const r=await fetch("/api/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData,mode:MODE,note:form.note,items:cart.map(i=>[i.s,i.c,i.n,i.qty,i.note])})});const j=await r.json();if(!j.ok)throw 0;cart=[];form.note="";save();cnt();stack=[{v:"done",id:j.id}];render();return}catch(e){b.disabled=false;b.textContent="Buyurtmani yuborish";msg("Yuborib bo'lmadi. Qayta urinib ko'ring yoki +998 72 200 00 00 ga qo'ng'iroq qiling.");return}}
  else{if(!form.phone.trim()){msg("Telefon raqamingizni kiriting.");return}window.open("https://t.me/share/url?url=%20&text="+encodeURIComponent(text()),"_blank")}}}
function text(){return `Yangi buyurtma (sayt)\nMijoz: ${form.name||"-"}\nTelefon: ${form.phone||"-"}\n\n`+cart.map((i,k)=>`${k+1}. ${i.n} [${i.s}${i.c?" / "+i.c:""}] — ${i.qty} ta`+(i.note?` (izoh: ${i.note})`:"")).join("\n")+(form.note?`\n\nIzoh: ${form.note}`:"")}
$("#cartbtn").onclick=()=>{if(top_().v!=="cart")go({v:"cart"})};
let tm;$("#q").oninput=e=>{const val=e.target.value,t=top_();clearTimeout(tm);tm=setTimeout(()=>{
 if(t.v==="items"){t.q=val;render()}else if(t.v==="find"){if(val.trim()){t.q=val;render()}else back()}else if(val.trim())go({v:"find",q:val})},200)};
cnt();render();
</script></body></html>
